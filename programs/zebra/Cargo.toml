[package]
name = "zebra"
version = "0.1.0"
description = "Zebra protocol: herd/stampede/harvest fee-split and cross-chain ZEC burn-stamp program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zebra"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["associated_token", "token"] }
